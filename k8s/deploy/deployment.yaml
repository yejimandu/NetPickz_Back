apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: netpickz-test
  name: netpickz-test
  labels:
    part-of: k8s-netpickz
    component: backend-server
    name: api-tester
    instance: netpickz-test
    version: 1.0.0
    managed-by: kubectl
spec:
  selector:
    matchLabels:
      part-of: k8s-netpickz
      component: backend-server
      name: api-tester
      instance: netpickz-test
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        part-of: k8s-netpickz
        component: backend-server
        name: api-tester
        instance: netpickz-test
        version: 1.0.0
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master
      containers:
        - name: api-tester-2121
          image: yeji3479/api-tester:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
